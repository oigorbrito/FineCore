[package]
name = "finecore"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "FineCore: interactive terminal host for Orca Harness. Streaming REPL, tool approvals, headless mode."
build = "build.rs"

[[bin]]
name = "finecore"
path = "src/main.rs"

[dependencies]
orca-harness-core = { path = "../harness-core" }
orca-harness-model-providers = { path = "../model-providers" }
orca-harness-provider-auth = { path = "../provider-auth" }
orca-harness-tools = { path = "../tools" }
orca-harness-tool-extensions = { path = "../tool-extensions" }
orca-harness-extensions = { path = "../extensions" }
async-trait = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["signal"] }
futures-util = { workspace = true }
base64 = "0.22"
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }
textwrap = "0.16"
unicode-width = "0.2"
syntect-tui = { version = "3.0.6", default-features = false }
syntect = { version = "5.3", default-features = false, features = ["default-syntaxes", "default-themes", "regex-fancy"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem"] }
