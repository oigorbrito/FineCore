name: FineCore integration review (read-only)

on:
  push:
    branches: [integration/finecore-orca-main-review]
  pull_request:
    branches: [main]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/**'
      - 'docs/identity-divergence.csv'
      - 'docs/upstream-import-manifest.csv'
      - 'scripts/verify_finecore_integration.py'
      - '.github/workflows/finecore-integration-review.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integration-review-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  parity:
    name: ${{ matrix.platform }} root integration
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux
            runner: ubuntu-24.04
          - platform: macOS
            runner: macos-15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Rust stable + rustfmt
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt
      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: integration-${{ matrix.platform }}
      - name: Audit donor and migration blobs, and retained main governance
        run: python3 scripts/verify_finecore_integration.py
      - name: Validate independent upstream tracker contracts
        run: python3 -m unittest discover -s scripts -p test_upstream_tracker.py -v
      - name: Rust formatting
        run: cargo fmt --all -- --check
      - name: Compile all workspace targets
        run: cargo check --workspace --all-targets --locked
      - name: FineCore CLI tests
        run: cargo test -p finecore --locked
