name: ci

# Merge gate for the workspace: formatting, non-regressing imported source
# size and Clippy baselines, the full test suite, benchmark reporting tests,
# a bench smoke run, and the release binary size. Consumes zero untrusted
# input. Benchmarks with budgets run in bench.yml so a slow benchmark job
# never holds up test feedback.
#
# `lint` and `test` compile different targets (check vs test profile), so
# they run as two jobs rather than one serial list.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  lint:
    name: fmt, source size, clippy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy, rustfmt

      - name: cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: lint

      - name: size-gate regression tests
        run: python3 -m unittest discover -s ci/tests -p 'test_*.py' -v

      - name: fmt
        run: cargo fmt --all --check

      # Two views of the same limit: the shell gate is what release.sh runs
      # locally and is the authority; the audit prints the largest files so
      # the ones approaching the limit are visible before they cross it.
      - name: source size
        run: |
          ./ci/check-source-size.sh
          python3 scripts/audit_crates.py --top 25

      - name: clippy
        run: |
          set +e
          cargo clippy --workspace --all-targets --message-format=json -- -D warnings \
            > "$RUNNER_TEMP/clippy.json" 2> "$RUNNER_TEMP/clippy.stderr"
          cargo_status=$?
          set -e
          cat "$RUNNER_TEMP/clippy.stderr"
          python3 scripts/check_clippy_baseline.py \
            --baseline ci/baselines/clippy-result-large-err-orca-d89.json \
            --cargo-exit-code "$cargo_status" \
            "$RUNNER_TEMP/clippy.json"

  test:
    name: cargo test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: test

      - name: test
        run: cargo test --workspace

      # Every benchmark parser and gate has its own tests; a broken parser
      # would otherwise fail (or pass) the bench job for the wrong reason.
      - name: benchmark reporting tests
        run: ./benchmarks/run_reporting_tests.sh

      # Compiles and runs every criterion bench once, as a test: proves the
      # bench targets still build and their setup code still runs.
      - name: bench (smoke)
        run: cargo bench --workspace -- --test

  size:
    name: release binary size
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: release

      - name: build
        run: cargo build --release -p orcacode

      - name: release binary size
        # The pinned Orca import is above the strict release cap. Keep PR CI
        # green only while the Linux binary does not grow beyond that exact
        # upstream baseline; release.sh retains the strict platform limits.
        run: ./ci/check-binary-size.sh --baseline-orca-d89
