name: Codex browser parity with Pi — offline protocol checks

on:
  push:
    branches: [feature/pi-auth-codex-browser-parity-01]
    paths:
      - 'crates/cli/src/auth/openai_codex/**'
      - 'crates/cli/Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/pi-auth-codex-browser-01.yml'
      - 'docs/engineering/PI_AUTH_CODEX_BROWSER_01.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  codex-browser:
    name: Pi Codex browser contract / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Rust 1.99.1
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: 1.99.1
          components: rustfmt
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Verify CLI compiles with pinned dependencies
        run: cargo check -p finecore --locked
      - name: Real loopback callback, PKCE and offline token-exchange tests
        run: cargo test -p finecore --locked auth::openai_codex::browser::tests -- --nocapture
      - name: Existing Codex device-code and store regressions
        run: cargo test -p finecore --locked auth::openai_codex::tests -- --nocapture
      - name: Full Linux CLI regression
        if: matrix.os == 'ubuntu-24.04'
        run: cargo test -p finecore --locked
