name: FineCore — observar upstream Pi

on:
  schedule:
    - cron: '37 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/pi-upstream-evolution-tracker.yml']
  pull_request:
    paths: ['.github/workflows/pi-upstream-evolution-tracker.yml']

permissions:
  contents: read

concurrency:
  group: finecore-pi-upstream-observe
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    defaults:
      run:
        working-directory: legacy/tracker
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify tracker contracts without network writes
        run: |
          python3 -m py_compile scripts/upstream_pi_tracker.py scripts/test_upstream_pi_tracker.py
          python3 -m unittest discover -s scripts -p 'test_upstream_pi_tracker.py' -v

  track:
    needs: validate
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      issues: write
    defaults:
      run:
        working-directory: legacy/tracker
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Track Pi PRs, commits, issues and releases (metadata only)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TRACKING_REPO: ${{ github.repository }}
          PI_TRACKER_REPORT: pi-upstream-evolution.json
        run: python3 scripts/upstream_pi_tracker.py
      - name: Preserve observed snapshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: finecore-pi-upstream-${{ github.run_id }}
          path: legacy/tracker/pi-upstream-evolution.json
          if-no-files-found: warn
          retention-days: 30
