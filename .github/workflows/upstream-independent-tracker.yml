name: Orca independent upstream tracker

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/upstream-independent-tracker.yml'
      - 'scripts/upstream_tracker.py'
      - 'scripts/test_upstream_tracker.py'
      - 'docs/engineering/upstream-tracker.md'

permissions:
  contents: read
  issues: write

concurrency:
  group: finecore-orca-upstream-tracker
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Validate tracker contracts
        run: python3 -m unittest discover -s scripts -p 'test_upstream_tracker.py' -v
      - name: Mirror Orca metadata (no code merges)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TRACKING_REPO: ${{ github.repository }}
          UPSTREAM_REPOSITORIES: okikorg/orca-harness
        run: python3 scripts/upstream_tracker.py
