name: FineCore — observar upstream Orca

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/upstream-independent-tracker.yml']
  pull_request:
    paths: ['.github/workflows/upstream-independent-tracker.yml']

permissions:
  contents: read

concurrency:
  group: finecore-orca-upstream-observe
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    defaults:
      run:
        working-directory: legacy/tracker
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify tracker contracts without network writes
        run: python3 -m unittest discover -s scripts -p 'test_upstream_tracker.py' -v

  track:
    needs: validate
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      issues: write
    defaults:
      run:
        working-directory: legacy/tracker
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Track Orca PRs, commits, issues, branch and releases (metadata only)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TRACKING_REPO: ${{ github.repository }}
          UPSTREAM_REPOSITORIES: okikorg/orca-harness
        run: python3 scripts/upstream_tracker.py
