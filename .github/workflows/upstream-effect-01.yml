name: UPSTREAM-EFFECT-01 paired workflow recovery / external effects

on:
  push:
    branches: [experiment/upstream-effect-01]
    paths:
      - '.github/workflows/upstream-effect-01.yml'
      - 'docs/engineering/upstream-effect-01/**'
      - 'scripts/analyze_upstream_effect_01.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: finecore-upstream-effect-01-${{ github.ref }}
  cancel-in-progress: false

jobs:
  compare:
    name: Same fixture on FineCore base and Orca retry #58 port
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CARGO_TERM_COLOR: never
      RUST_BACKTRACE: '1'
      CARGO_TARGET_DIR: ${{ github.workspace }}/shared-target
    steps:
      - name: Checkout experiment harness
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: harness
          persist-credentials: false
      - name: Checkout FineCore frozen baseline
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: oigorbrito/finecore
          ref: 2f980015a733ec449ca1ea8be51e97da08220fb1
          path: base
          persist-credentials: false
      - name: Checkout FineCore retry port frozen candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: oigorbrito/finecore
          ref: 092ff1ff0fb654c814663a296318abc06266584f
          path: candidate
          persist-credentials: false
      - name: Install exact Rust compiler
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable action
        with:
          toolchain: 1.99.1
      - name: Verify pinned inputs and add same isolated fixture
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C base rev-parse HEAD)" = 2f980015a733ec449ca1ea8be51e97da08220fb1
          test "$(git -C candidate rev-parse HEAD)" = 092ff1ff0fb654c814663a296318abc06266584f
          rustc --version
          cargo --version
          mkdir -p results
          cp harness/docs/engineering/upstream-effect-01/upstream_effect.rs base/crates/tools/tests/upstream_effect.rs
          cp harness/docs/engineering/upstream-effect-01/upstream_effect.rs candidate/crates/tools/tests/upstream_effect.rs
          sha256sum base/crates/tools/tests/upstream_effect.rs candidate/crates/tools/tests/upstream_effect.rs | tee results/fixture-hashes.txt
          cmp base/crates/tools/tests/upstream_effect.rs candidate/crates/tools/tests/upstream_effect.rs
      - name: FineCore baseline 160 reproducible workflow trials
        working-directory: base
        shell: bash
        env:
          EXPECT_RETRY: '0'
        run: |
          set -euo pipefail
          cargo test -p orca-harness-tools --test upstream_effect --locked -- --nocapture --test-threads=1 2>&1 | tee ../results/baseline.log
      - name: Retry candidate 160 identical workflow trials
        working-directory: candidate
        shell: bash
        env:
          EXPECT_RETRY: '1'
        run: |
          set -euo pipefail
          cargo test -p orca-harness-tools --test upstream_effect --locked -- --nocapture --test-threads=1 2>&1 | tee ../results/retry.log
      - name: Strict paired analysis
        shell: bash
        run: |
          set -euo pipefail
          python3 harness/scripts/analyze_upstream_effect_01.py results/baseline.log results/retry.log results/summary.json | tee results/report.log
      - name: Preserve raw evidence on failure or success
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: finecore-upstream-effect-01-raw
          path: results/
          if-no-files-found: warn
          retention-days: 30
