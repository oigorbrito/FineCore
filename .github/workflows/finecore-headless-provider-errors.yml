name: FineCore inherited headless provider error validation

on:
  push:
    branches: [fix/orca-headless-provider-errors]
    paths:
      - 'crates/**'
      - '.github/workflows/finecore-headless-provider-errors.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: headless-provider-errors-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: '1'

jobs:
  corrective:
    name: provider error rendering regression and workspace
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - name: Checkout candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Rust stable with rustfmt
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt
      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: headless-provider-error
      - name: Patch whitespace
        run: git diff --check "$(git merge-base HEAD origin/integration/finecore-orca-main-review)" HEAD
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Compile all workspace targets
        run: cargo check --workspace --all-targets --locked
      - name: Targeted headless error regression
        run: cargo test -p finecore --bin finecore provider_error_tests --locked -- --nocapture
      - name: Model provider error tests
        run: cargo test -p orca-harness-model-providers --locked
      - name: FineCore CLI regression suite
        run: cargo test -p finecore --locked
      - name: Entire workspace regression suite
        run: cargo test --workspace --locked
