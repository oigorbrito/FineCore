# Upstream watch

Projetos que este repositório acompanha. O workflow `upstream-watch` lê o último SHA revisado de cada um e lista o que aconteceu depois dele.

Ao revisar o resumo semanal, copie o HEAD indicado para a coluna **Último SHA revisado** e atualize a data. Assim o próximo resumo começa dali. Use o SHA completo de 40 caracteres.

